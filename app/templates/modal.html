<div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalDayTitle" aria-hidden="true">
  <div class="modal">
    <header class="modal__header">
      <div>
        <p class="modal__subtitle">Detailed meal</p>
        <h2 id="modalDayTitle" class="modal__title">Day</h2>
      </div>
      <button id="closeBtn" class="button button--primary" type="button">Close</button>
    </header>

    <section class="modal__section">
      <h3 id="modalMealTitle" class="modal__section-title"></h3>
      <dl class="modal__details">
        <div class="modal__detail">
          <dt>Name</dt>
          <dd id="mealName"></dd>
        </div>
        <div class="modal__detail">
          <dt>Prep time</dt>
          <dd><span id="mealTime"></span> min</dd>
        </div>
        <div class="modal__detail">
          <dt>Calories</dt>
          <dd><span id="mealCalories"></span></dd>
        </div>
      </dl>
    </section>

    <section class="modal__section">
      <h4 class="modal__section-title">Ingredients</h4>
      <ul id="mealIngredients" class="ingredient-list"></ul>
    </section>

    <section class="modal__section">
      <h4 class="modal__section-title">Recipe</h4>
      <pre id="mealRecipe" class="recipe-text"></pre>
    </section>
  </div>
</div>
