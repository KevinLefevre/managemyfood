<div id="planningModalOverlay" class="modal-overlay" aria-hidden="true">
  <div class="modal modal--narrow" role="dialog" aria-modal="true" aria-labelledby="planningModalTitle">
    <header class="modal__header">
      <div>
        <p class="modal__subtitle">Meal planner supervisor</p>
        <h2 id="planningModalTitle" class="modal__title">Start a planning session</h2>
      </div>
      <button id="closePlanningBtn" class="button button--primary" type="button">Close</button>
    </header>

    <div id="chatArea" class="planning-chat" role="log" aria-live="polite"></div>

    <div class="planning-controls">
      <label class="sr-only" for="chatInput">Message the planning assistant</label>
      <input id="chatInput" class="planning-input" type="text" placeholder="Ask for new ideas…" />
      <button id="sendChatBtn" class="button button--accent" type="button">Send</button>
    </div>
  </div>
</div>
